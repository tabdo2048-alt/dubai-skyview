name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Verify unit offers and PDF layouts
        run: npm run test:unit-offers

      - name: Verify Cesium geodata
        run: npm run test:cesium-geodata

      - name: Verify Google photorealistic provider
        run: npm run test:photorealistic

      - name: Verify virtual tour data layer
        run: npm run test:virtual-tour-data

      - name: Verify virtual tour viewer and hotspots
        run: npm run test:virtual-tour-viewer

      - name: Verify virtual tour floors and floor plans
        run: npm run test:virtual-tour-floors

      - name: Verify virtual tour admin management
        run: npm run test:virtual-tour-admin

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
